# comments-for-github-pages — artifact-deployed Pages template (recommended)
#
# Copy this file to .github/workflows/sync-comments.yml in your pages repo,
# and copy scripts/sync-comments.mjs alongside it (vendoring — no cross-repo
# `uses:` needed, which matters on GitHub Enterprise Server without GitHub
# Connect). Edit the two EDIT-marked spots.
#
# This variant deploys Pages from an artifact, so comment data never gets
# committed — no commit loops, no history noise.

name: Sync comments & deploy Pages

on:
  discussion:
    types: [created, edited, deleted, category_changed, transferred]
  discussion_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # daily drift-repair fallback

# Explicit permissions: overrides restrictive org-level GITHUB_TOKEN defaults.
permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write

# Collapse bursts of comment events into one run.
concurrency:
  group: sync-comments
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # EDIT: build your site into ./_site. For a plain static site with no
      # build step, a copy is enough (shown). Replace with your generator's
      # build command (jekyll build -d _site, hugo -d _site, etc.).
      - name: Build site
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' --exclude '.github' --exclude 'scripts' ./ _site/

      - name: Sync Discussion comments
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # EDIT: --category must match your Discussions category name.
        run: node scripts/sync-comments.mjs --category Comments --out _site/comments

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
